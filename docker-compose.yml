# Local stack:  docker compose up -d --build
#   Grafana       http://localhost:3000  (anonymous viewer; admin/admin to edit)
#   Prometheus    http://localhost:9090
#   Alertmanager  http://localhost:9093
#   orders API    http://localhost:8000/docs
services:
  orders-service:
    build: ./app
    ports: ["8000:8000"]
    environment:
      LOG_FILE: /var/log/app/orders-service.log
    volumes: ["applogs:/var/log/app"]
    restart: always              # lets the chaos "kill" experiment measure recovery
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 2s
      retries: 3

  loadgen:
    build: ./loadgen
    command: ["--url", "http://orders-service:8000", "--rps", "20"]
    depends_on: [orders-service]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports: ["9093:9093"]
    volumes: ["./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki.yml"]
    ports: ["3100:3100"]
    volumes: ["./loki/loki.yml:/etc/loki/loki.yml:ro"]

  promtail:
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./loki/promtail.yml:/etc/promtail/promtail.yml:ro
      - applogs:/var/log/app:ro
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/orders-slo.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki]

volumes:
  applogs: {}
