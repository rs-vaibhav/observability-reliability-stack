apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: shop
  labels: { app: orders-service }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: orders-service }
  template:
    metadata:
      labels: { app: orders-service }
    spec:
      terminationGracePeriodSeconds: 30
      # spread replicas over nodes so a single node failure cannot take the service down
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app: orders-service } }
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: orders
          image: orders-service:local
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - name: SERVICE_NAME
              value: orders-service
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { cpu: 500m, memory: 192Mi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            # give kube-proxy / ingress time to remove the pod from endpoints before shutdown
            preStop:
              exec: { command: ["sleep", "8"] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: shop
  labels: { app: orders-service }
spec:
  selector: { app: orders-service }
  ports: [{ name: http, port: 8000, targetPort: http, nodePort: 30080 }]
  type: NodePort
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orders-service
  namespace: shop
spec:
  minAvailable: 2          # node drains can never take more than one replica at a time
  selector: { matchLabels: { app: orders-service } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orders-service
  namespace: shop
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: orders-service }
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: orders-service
  namespace: shop
  labels: { release: monitoring }
spec:
  selector: { matchLabels: { app: orders-service } }
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      relabelings:
        - targetLabel: service
          replacement: orders-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: shop
spec:
  replicas: 1
  selector: { matchLabels: { app: loadgen } }
  template:
    metadata:
      labels: { app: loadgen }
    spec:
      containers:
        - name: loadgen
          image: orders-loadgen:local
          imagePullPolicy: IfNotPresent
          args: ["--url", "http://orders-service.shop:8000", "--rps", "20"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
