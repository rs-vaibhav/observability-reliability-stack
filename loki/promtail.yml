server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: app-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: orders-service
          __path__: /var/log/app/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            route: route
            status: status
            ts: ts
      - timestamp:
          source: ts
          format: RFC3339Nano
      # only low-cardinality fields become labels; route/status stay searchable in the line
      - labels:
          level:
          service:
